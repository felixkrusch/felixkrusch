<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found</title>
  <script>
    (function () {
      var path = location.pathname || "";
      if (path === "/fr" || path.indexOf("/fr/") === 0) {
        location.replace("/");
      }
    })();
  </script>
</head>
<body>
  <p>Page not found. <a href="/">Home</a></p>
</body>
</html>
